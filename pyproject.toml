[project]
name = "hd-procova"
version = "0.1.0"
description = "Prognostic covariate adjustment for Huntington's Disease clinical trials"
requires-python = ">=3.10"
dependencies = [
    "arviz>=0.15",
    "joblib",
    "lightgbm>=4",
    "matplotlib>=3",
    "numpy>=1.26",
    "numpyro>=0.15",
    "optuna>=3",
    "pandas>=2",
    "pymc>=5",
    "pytensor>=2.18",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "xgboost>=2",
    "jax>=0.4",
    "jaxlib>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
