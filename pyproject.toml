[project]
name = "hd-procova"
version = "0.1.0"
description = "Prognostic covariate adjustment for Huntington's Disease clinical trials"
requires-python = ">=3.10"
dependencies = [
    "arviz>=0.17",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "numpyro>=0.15",
    "optuna>=3.5",
    "pandas>=2.1",
    "pymc>=5.10",
    "pytensor>=2.18",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "xgboost>=2.0",
    "jax>=0.4",
    "jaxlib>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
